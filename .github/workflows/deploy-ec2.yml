name: Build and deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Configure AWS credentials
        id: configure_aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload JAR to private deployment bucket
        id: upload_jar
        run: |
          aws s3 cp \
            target/aws-sandbox-api-0.0.1-SNAPSHOT.jar \
            "s3://${DEPLOY_BUCKET}/deploy/aws-sandbox-api.jar" \
            --sse AES256

      - name: Deploy through Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          commands=$(jq -n \
            --arg bucket "$DEPLOY_BUCKET" \
            --arg region "$AWS_REGION" \
            '{
              commands: [
                "set -e",
                "aws s3 cp s3://\($bucket)/deploy/aws-sandbox-api.jar /tmp/aws-sandbox-api.jar --region \($region)",
                "install -o aws-sandbox-api -g aws-sandbox-api -m 0644 /tmp/aws-sandbox-api.jar /opt/aws-sandbox-api/app.jar",
                "systemctl restart aws-sandbox-api.service",
                "systemctl is-active --quiet aws-sandbox-api.service",
                "rm -f /tmp/aws-sandbox-api.jar"
              ]
            }')

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy API commit ${GITHUB_SHA}" \
            --parameters "$commands" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 36); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$status" in
              Success)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated|DeliveryTimedOut|ExecutionTimedOut)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "Timed out waiting for the Systems Manager command."
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json || true
          exit 1

      - name: Remove staged JAR
        if: always() && steps.configure_aws.outcome == 'success' && steps.upload_jar.outcome == 'success'
        run: aws s3 rm "s3://${DEPLOY_BUCKET}/deploy/aws-sandbox-api.jar"
